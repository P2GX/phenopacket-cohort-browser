name: Build offline bundle

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build offline bundle
        run: python tools/build_offline.py

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cohort-explorer-offline
          path: dist/cohort-explorer-offline.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/cohort-explorer-offline.zip --clobber